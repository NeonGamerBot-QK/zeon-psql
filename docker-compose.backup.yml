services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres

  # Local-only backup job. Run with: docker compose -f docker-compose.backup.yml run --rm backup
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    container_name: psql_backup
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backup.sh:/app/backup.sh:ro
      - ./prep_backup.sh:/app/prep_backup.sh:ro
      - ./backup-entrypoint.sh:/app/backup-entrypoint.sh:ro
      # backup.sh rewrites .env (strips CRLF), so this one stays writable
      - ./.env:/app/.env
      - ./backups:/app/backups
      - ~/.gnupg:/gnupg-host:ro
      - ~/.ssh:/root/.ssh:ro
    networks:
      - psqlnet

networks:
  psqlnet:
