# version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: psql_server
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./idksock:/var/run/postgresql
      - ./init:/docker-entrypoint-initdb.d 
      - ./:/app
    networks:
      - psqlnet
    ports:
      - "5634:5432"   # host:container
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot job, not started by `up`. Run with: docker compose run --rm backup
  backup:
    build: .
    container_name: psql_backup
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backup.sh:/app/backup.sh:ro
      - ./prep_backup.sh:/app/prep_backup.sh:ro
      # backup.sh rewrites .env (strips CRLF), so this one stays writable
      - ./.env:/app/.env
      - ./backups:/app/backups
      - ~/.gnupg:/gnupg-host:ro
      - ~/.ssh:/root/.ssh:ro
    networks:
      - psqlnet

networks:
  psqlnet:
